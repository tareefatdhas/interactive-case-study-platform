name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ci-build-placeholder
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-classfully.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-classfully
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-classfully.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:ci'
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://ci-classfully-default-rtdb.asia-southeast1.firebasedatabase.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e
